name: update-snapshots

# Regenerates the Playwright screenshot baselines on the same runner image the gate uses, so
# they match CI's fonts and rendering exactly, and commits them to the branch. Run it after a
# deliberate visual change; the win32 baselines are refreshed locally with --update-snapshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build packages
        run: npm run build
      - name: Update dashboard baselines
        run: npx playwright test --update-snapshots
        working-directory: apps/web
      - name: Update design-system baselines
        run: npx playwright test --update-snapshots
        working-directory: packages/ui
      - name: Commit
        run: |
          git config user.name "identizen-ci"
          git config user.email "ci@identizen.com"
          git add apps/web/tests/__snapshots__ packages/ui/tests/__snapshots__
          if git diff --cached --quiet; then echo "no baseline changes"; exit 0; fi
          git commit -m "test: refresh Playwright baselines from the CI runner"
          git push
