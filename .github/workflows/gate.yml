name: gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Baselines pushed by update-snapshots use GITHUB_TOKEN, which never triggers a run; start one by hand.
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identizen
          POSTGRES_PASSWORD: identizen
          POSTGRES_DB: identizen
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U identizen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://identizen:identizen@localhost:5433/identizen
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      # Four Playwright suites plus their web servers on a four-core runner starve each other:
      # the browser session dies mid-test and Jest hits its per-test timeout. Two at a time.
      TURBO_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The same npm as the checkouts this repo is developed with: npm 10 (Node 22's bundled one)
      # judges optional platform packages and overrides differently, and `npm sbom` refuses a tree
      # that npm 12 accepts.
      - run: npm install -g npm@12
      - run: npm ci
      - name: Install Playwright browsers
        # --with-deps runs apt, whose mirrors fail now and then; try three times before failing.
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && break || sleep 20; done
      - name: Build packages
        run: npm run build
      - name: Gate
        run: npm run gate
      - name: SBOM
        run: npm run sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            **/playwright-report/**
            **/test-results/**
          retention-days: 7
