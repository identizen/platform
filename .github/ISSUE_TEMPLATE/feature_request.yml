name: Feature request
description: Propose a change to the product, the SDKs, or the protocol.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to see. For protocol changes, say what the wire format or key derivation would become.
    validations:
      required: true
  - type: checkboxes
    id: protocol
    attributes:
      label: Scope
      options:
        - label: This touches the protocol (spec/ or packages/protocol) and needs a discussion before code.
