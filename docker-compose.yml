services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identizen
      POSTGRES_PASSWORD: identizen
      POSTGRES_DB: identizen
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U identizen']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
